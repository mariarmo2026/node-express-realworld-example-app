name: CI/CD with DevSecOps

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Build project
        run: yarn build || echo "Build skipped"

      # === SAST: Semgrep (Security Gateway — блокирует при находках) ===
      - name: Run Semgrep (SAST)
        id: semgrep
        run: |
          pip install semgrep
          semgrep --config=p/security-audit --config=p/owasp-top-ten --error --json -o semgrep-report.json . || true
          semgrep --config=p/security-audit --config=p/owasp-top-ten --error .
        continue-on-error: false

      # === Security Check: TruffleHog (secrets) ===
      - name: Run TruffleHog (secret scanning)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      # === Security Check: Trivy (filesystem scan) ===
      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # === Security Check: Trivy (Dockerfile) ===
      - name: Run Trivy (Dockerfile)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile'
          format: 'table'
          exit-code: '0'

      # === Security Gateway: комментарий в PR с рекомендациями ===
      - name: Comment on PR if Semgrep found issues
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Security Gateway: обнаружены уязвимости
              
              Пайплайн заблокирован, потому что **Semgrep (SAST)** нашёл проблемы в коде.
              
              ### Что делать:
              1. Посмотрите отчёт в логах Actions (шаг «Run Semgrep (SAST)»).
              2. Исправьте найденные уязвимости.
              3. Запушьте изменения — пайплайн запустится снова.
              
              ### Рекомендация
              Зафиксируйте GitHub Actions на конкретный commit SHA вместо тегов (`@v4` → `@8ade135...`). Это устранит риск supply-chain атак.
              
              Подробнее: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions`
            })
