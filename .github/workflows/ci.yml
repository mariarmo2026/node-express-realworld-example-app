name: CI/CD with DevSecOps

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Build project
        run: yarn build || echo "Build skipped"

      # === SAST: Semgrep ===
      - name: Run Semgrep (SAST)
        run: |
          pip install semgrep
          semgrep --config=p/security-audit --config=p/owasp-top-ten --json -o semgrep-report.json . || true
          semgrep --config=p/security-audit --config=p/owasp-top-ten .

      # === Security Check: TruffleHog (secrets) ===
      - name: Run TruffleHog (secret scanning)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      # === Security Check: Trivy (filesystem scan) ===
      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # === Security Check: Trivy (Dockerfile) ===
      - name: Run Trivy (Dockerfile)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile'
          format: 'table'
          exit-code: '0'
