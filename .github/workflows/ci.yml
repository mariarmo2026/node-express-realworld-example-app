name: CI/CD with DevSecOps

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Build project
        run: yarn build || echo "Build skipped"

      # === SAST: Semgrep ===
      - name: Run Semgrep (SAST)
        id: semgrep
        run: |
          pip install semgrep
          semgrep --config=p/security-audit --config=p/owasp-top-ten --error .
        continue-on-error: true

      # === Security Gateway: комментарий в PR ===
      - name: Comment on PR if Semgrep found issues
        if: steps.semgrep.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Security Gateway: обнаружены уязвимости\n\nПайплайн заблокирован, потому что Semgrep (SAST) нашёл проблемы в коде.\n\n### Рекомендация\nЗафиксируйте GitHub Actions на конкретный commit SHA вместо тегов.`
            })

      # === Security Gateway: остановка релиза ===
      - name: Fail pipeline if Semgrep found issues
        if: steps.semgrep.outcome == 'failure' && github.event_name == 'pull_request'
        run: exit 1

      # === Security Check: TruffleHog ===
      - name: Run TruffleHog (secret scanning)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      # === Security Check: Trivy ===
      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy (Dockerfile)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile'
          format: 'table'
          exit-code: '0'

  # ==========================================
  # ДЖОБ ДЕПЛОЯ НА VDS (Continuous Deployment)
  # ==========================================
  deploy:
    needs: build-and-scan
    runs-on: ubuntu-latest
    # Запускаем только при пуше в master
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Deploy to VDS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            # Удаляем старую папку necommerce, если она осталась
            rm -rf /root/necommerce
            
            # Клонируем проект в правильную папку realworld-app
            if [ ! -d "/root/realworld-app" ]; then
              git clone https://github.com/mariarmo2026/node-express-realworld-example-app.git /root/realworld-app
            fi
            
            cd /root/realworld-app
            git pull origin master
            
            # Создаем .env файл
            cat > .env << 'EOF'
            DB_PORT_EXTERNAL=30432
            DB_PORT_INTERNAL=5432
            DB_USERNAME=postgres
            DB_PASSWORD=postgres
            DB_NAME=realworld
            API_PORT_EXTERNAL=30400
            PORT=30400
            NODE_ENV=production
            JWT_SECRET=super-secret-jwt-key-for-diploma
            DATABASE_URL=postgresql://postgres:postgres@localhost:30432/realworld
            EOF
            
            # Перезапускаем контейнеры
            docker compose down || true
            docker compose up -d --build
            
            echo "✅ Деплой успешно завершен!"
